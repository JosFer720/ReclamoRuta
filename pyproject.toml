[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reclamoruta"
version = "0.1.0"
description = "Clasificación de consultas bancarias en inglés y sugerencia de ruta con revisión humana (CC3092, UVG)."
readme = "README.md"
requires-python = ">=3.11"
# data/evaluate/uncertainty/value/contracts/benchmark/study use only the standard library.
dependencies = []

[project.optional-dependencies]
# Interfaz. 1.49 es la primera con form_submit_button(key=...), que usa app.py.
app = ["streamlit>=1.49"]
# Entrenamiento y predictor. Suite verificada con los mínimos (torch 2.5.1,
# transformers 4.45.2, safetensors 0.4.5, scikit-learn 1.5.2) y con transformers
# 4.56.2 y 5.23.0. PyTorch con CUDA se instala antes desde el índice de PyTorch.
model = ["torch>=2.5", "transformers>=4.45,<6", "safetensors>=0.4", "scikit-learn>=1.5"]
# Suite completa: pruebas, interfaz y modelos.
dev = ["pytest==9.1.1", "reclamoruta[app,model]"]

[tool.setuptools.packages.find]
where = ["src"]

# La configuración de pytest vive en pytest.ini.
